[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anastomosis"
version = "0.1.0"
description = "A long-running generative visual field for self-regulation and stimming"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "wgpu>=0.32",
    "rendercanvas>=2.7",
    "numpy>=1.26",
    "tomlkit>=0.12",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# The control panel and the render window share one Qt event loop.
ui = ["PySide6>=6.6"]
# Capture for the resonance mode (DESIGN.md §16). Optional in the same
# spirit as [ui]: without it the mode still opens, with a status line
# saying the field is on its own. On Windows the soundcard package rides
# along, because "whatever the machine is playing" is a WASAPI loopback
# there and PortAudio (sounddevice) cannot record one; everywhere else
# PortAudio alone covers the table in §16.2.
audio = [
    "sounddevice>=0.4.6",
    "soundcard>=0.4.3; sys_platform == 'win32'",
]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[project.scripts]
anastomosis = "anastomosis.__main__:main"

[tool.setuptools.packages.find]
include = ["anastomosis*"]

[tool.setuptools.package-data]
anastomosis = ["shaders/*.wgsl", "presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running soak tests, deselect with -m 'not slow'"]
