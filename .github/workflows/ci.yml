name: CI

# The whole pipeline is core WebGPU with no optional features, specifically so
# that the software adapter exercises the same code paths as a real GPU. That
# is what lets this run on an ordinary Linux runner: Mesa's lavapipe provides
# the Vulkan implementation, and no hosted GPU is needed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python }}${{ matrix.extras == 'dev' && ', no ui' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        extras: ["ui,dev"]
        include:
          # The README promises the app works without PySide6. This leg keeps
          # that promise honest: the control-panel tests importorskip, so a
          # hard dependency creeping into an import path shows up here as a
          # collection error rather than silently.
          - python: "3.11"
            extras: "dev"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            mesa-vulkan-drivers libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package
        run: pip install -e ".[${{ matrix.extras }}]"

      # Without this the suite would still pass if the driver were missing:
      # the gpu_device fixture skips rather than fails when no adapter can be
      # acquired, so a broken runner would produce a green run that tested
      # almost nothing. Fail loudly here instead.
      - name: Require a working adapter
        run: |
          python -c "
          from anastomosis.device import request_device
          _, info = request_device()
          print('adapter:', info.describe())
          "

      # -rs reports skips: the ui legs should skip nothing, and the no-ui leg
      # should skip only the PySide6 tests. Anything else is worth a look.
      - name: Run the fast suite
        run: pytest -m "not slow" -rs

  soak:
    name: soak (slow suite)
    # Nightly and on demand only. These are the long-horizon tests -- drift,
    # morphology, regime occupancy -- and they cost minutes rather than
    # seconds even before the software adapter's penalty.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            mesa-vulkan-drivers libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package
        run: pip install -e ".[ui,dev]"

      - name: Require a working adapter
        run: |
          python -c "
          from anastomosis.device import request_device
          _, info = request_device()
          print('adapter:', info.describe())
          "

      - name: Run the slow suite
        run: pytest -m slow -rs
