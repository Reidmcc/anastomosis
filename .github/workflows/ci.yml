name: CI

# The whole pipeline is core WebGPU with no optional features, specifically so
# that the software adapter exercises the same code paths as a real GPU. That
# is what lets this run on an ordinary Linux runner: Mesa's lavapipe provides
# the Vulkan implementation, and no hosted GPU is needed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python }}${{ matrix.extras == 'dev' && ', no ui' || '' }})
    runs-on: ubuntu-24.04
    # Room for the driver install to burn its full budget above and still
    # leave the suite time to run and report.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        extras: ["ui,dev"]
        include:
          # The README promises the app works without PySide6. This leg keeps
          # that promise honest: the control-panel tests importorskip, so a
          # hard dependency creeping into an import path shows up here as a
          # collection error rather than silently.
          - python: "3.11"
            extras: "dev"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # apt on the hosted runners will block forever rather than fail: the
      # image runs its own background package activity, and a job that starts
      # while that holds the dpkg lock simply waits. Lock::Timeout turns that
      # into an error with a legible message, and DEBIAN_FRONTEND and
      # NEEDRESTART_MODE stop the two prompts that otherwise wait on a tty
      # nobody is attached to. The variables go on the sudo command line
      # because sudo drops them from the surrounding environment.
      #
      # The budget is set from what the contention actually costs. Across one
      # four-job run this step took 37s, 162s, 243s and 354s -- the spread is
      # the lock, not the download. Each apt call gets its own 300s lock wait,
      # so a legitimately unlucky job can spend close to eleven minutes here
      # and still be working. Fifteen leaves that room while still bounding a
      # genuine hang, which is the case the timeout exists for.
      - name: Install the software Vulkan driver
        timeout-minutes: 15
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o DPkg::Lock::Timeout=300 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends -y \
            mesa-vulkan-drivers libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package
        run: pip install -e ".[${{ matrix.extras }}]"

      # Without this the suite would still pass if the driver were missing:
      # the gpu_device fixture skips rather than fails when no adapter can be
      # acquired, so a broken runner would produce a green run that tested
      # almost nothing. Fail loudly here instead.
      - name: Require a working adapter
        run: |
          python -c "
          from anastomosis.device import request_device
          _, info = request_device()
          print('adapter:', info.describe())
          "

      # -rs reports skips: the ui legs should skip nothing, and the no-ui leg
      # should skip only the PySide6 tests. Anything else is worth a look.
      - name: Run the fast suite
        run: pytest -m "not slow" -rs

  soak:
    name: soak (slow suite)
    # Nightly and on demand only. These are the long-horizon tests -- drift,
    # morphology, regime occupancy -- and they cost minutes rather than
    # seconds even before the software adapter's penalty.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The suite takes about ten minutes on lavapipe. This is deliberately a
    # backstop against a driver-level hang, not a performance budget: these
    # tests can wedge rather than fail if the adapter dies under them.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # apt on the hosted runners will block forever rather than fail: the
      # image runs its own background package activity, and a job that starts
      # while that holds the dpkg lock simply waits. Lock::Timeout turns that
      # into an error with a legible message, and DEBIAN_FRONTEND and
      # NEEDRESTART_MODE stop the two prompts that otherwise wait on a tty
      # nobody is attached to. The variables go on the sudo command line
      # because sudo drops them from the surrounding environment.
      #
      # The budget is set from what the contention actually costs. Across one
      # four-job run this step took 37s, 162s, 243s and 354s -- the spread is
      # the lock, not the download. Each apt call gets its own 300s lock wait,
      # so a legitimately unlucky job can spend close to eleven minutes here
      # and still be working. Fifteen leaves that room while still bounding a
      # genuine hang, which is the case the timeout exists for.
      - name: Install the software Vulkan driver
        timeout-minutes: 15
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o DPkg::Lock::Timeout=300 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends -y \
            mesa-vulkan-drivers libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package
        run: pip install -e ".[ui,dev]"

      - name: Require a working adapter
        run: |
          python -c "
          from anastomosis.device import request_device
          _, info = request_device()
          print('adapter:', info.describe())
          "

      - name: Run the slow suite
        run: pytest -m slow -rs
